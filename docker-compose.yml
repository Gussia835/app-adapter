services:
  postgres:
    image: postgres:15-alpine
    container_name: pom_db
    environment:
      POSTGRES_DB: pom_db
      POSTGRES_USER: pom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres:/docker-entrypoint-initdb.d
    networks:
      - foodcards-network

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: gru_db
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      APP_USER: GRU
      APP_USER_PASSWORD: ${GRU_APP_PASSWORD}
    ports:
      - "1521:1521"
    networks:
      - foodcards-network
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./init-oracle:/container-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "echo 'exit' | sqlplus -L sys/${ORACLE_SYS_PASSWORD}@//localhost:1521/XE as sysdba | grep -q 'Connected to:'" ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 40s

  receiver:
    build: ./Receiver
    container_name: receiver
    ports:
      - "666:666"
      - "6666:6666"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GRU_APP_PASSWORD=${GRU_APP_PASSWORD}
      - RECEIVER_DATASOURCE_POM_URL=jdbc:postgresql://pom_db:5432/pom_db
      - RECEIVER_DATASOURCE_POM_USERNAME=pom
      - RECEIVER_DATASOURCE_GRU_URL=jdbc:oracle:thin:@gru_db:1521/XEPDB1
      - RECEIVER_DATASOURCE_GRU_USERNAME=GRU
      - APP_FILESPATHS_PROCESS-DIR=/app/incoming
      - APP_FILESPATHS_TARGET-DIR=/app/target
    volumes:
      - ./incoming:/app/incoming
      - ./target:/app/target
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - foodcards-network

  generator:
    build: ./FoodCards
    container_name: generator
    ports:
      - "90:90"
    environment:
      - SEND_URL=http://receiver:666/files
      - GRPC_HOST=receiver
      - GRPC_PORT=6666
    volumes:
      - generator_output:/app/out/cards
    depends_on:
      - receiver
    networks:
      - foodcards-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - foodcards-network

  app-adapter:
    build: ./App-adapter
    container_name: app_adapter
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GRU_APP_PASSWORD=${GRU_APP_PASSWORD}

      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - foodcards-network


volumes:
  postgres_data:
  oracle_data:
  generator_output:

networks:
  foodcards-network:
    driver: bridge
